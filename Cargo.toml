[package]
name = "srt-vpn"
version = "0.3.0"
edition = "2021"
description = "SRT 外壳 + 自研 QUIC 语义传输 VPN（2026-08-20 重构）"
license = "MIT"

[dependencies]
# CLI 参数解析（-c / -m / -v / -h + SOCKS5 完整参数）
clap = { version = "4", features = ["derive"] }
# 配置加载（JSON 语法，server.conf / client.json 统一 schema）
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 异步运行时（客户端/服务器事件循环）
tokio = { version = "1", features = ["full"] }
# 密码学（SOCKS5 用户密码 argon2 哈希 / 密钥派生与认证 sha2）
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"
# 日志（JSON 结构化日志）
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
# 2026-08-20 重构清理：移除 libc/cc/build.rs（libsrt 依赖）、hmac/hex（旧 streamid
# 令牌，已删除其函数）、crossbeam-channel（旧发送通道，已改 tokio）

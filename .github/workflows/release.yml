# ============================================================
# 手动发布版本：workflow_dispatch 触发 → 编译 amd64/arm64 镜像 → 推送 GHCR
#
# 用法：GitHub 仓库 Actions 页面 → "Build & Publish Docker Image" →
#       Run workflow（可填版本号 tag）
# ============================================================
name: Build & Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（镜像 tag，如 1.0.0；留空则用 git describe）'
        required: false
        default: ''

jobs:
  build-and-publish:
    name: Build & Publish (amd64 + arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # 需要 srt-1.5.6/ 源码（git 仓库内）用于构建 libsrt
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 确定版本号
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "TAG=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # 无指定版本时用当前 git 描述（如 v0.1.0-3-gabc123）
            echo "TAG=$(git describe --tags --always 2>/dev/null || echo latest)" >> "$GITHUB_OUTPUT"
          fi

      - name: 设置 Docker Buildx（支持多架构）
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.TAG }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.TAG }}
            org.opencontainers.image.description=SRT-VPN - 基于 SRT 直播流协议的 VPN 隧道

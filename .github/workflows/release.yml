# ============================================================
# 发布工作流：手动 workflow_dispatch 或打 tag（v*）触发
#
# 产出（2026-08-19 扩展）：
# 1. Docker 多架构镜像（amd64/arm64）→ 推送 GHCR（原有逻辑）
# 2. 纯静态二进制（amd64/arm64）→ 上传 Release assets
#    - passwall 组件更新使用：文件名 srt-vpn-linux-amd64 / srt-vpn-linux-arm64
#    - Alpine/musl 全静态链接（含 OpenSSL），OpenWrt 上零依赖直接运行
#
# 并行策略（2026-08-19 优化）：
# - amd64：ubuntu-latest（x86_64 原生编译）
# - arm64：ubuntu-24.04-arm（GitHub 原生 ARM runner，无需 QEMU 交叉模拟）
#   → 两个 job 并行原生编译各自架构，比 buildx 单 job 双架构（QEMU 模拟）
#     快数倍（libsrt C++ 源码编译量大，QEMU 模拟 arm64 极慢）
# - 最后 merge job 用 docker buildx imagetools create 合并多架构 manifest
#
# 用法：
# - 手动：Actions 页面 → "Build & Publish" → Run workflow（可填版本号 tag）
# - 自动：push v* tag（如 v0.2.0），自动生成 Release 并附加二进制 + 镜像
# ============================================================
name: Build & Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（镜像 tag，如 1.0.0；留空则用 git describe）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  # 双架构并行构建（各用原生 runner，互不阻塞）
  build:
    name: Build ${{ matrix.arch }}
    # 2026-08-19 修复：输出 TAG 供 merge job 复用（单一事实来源，避免两处计算不一致）
    outputs:
      tag: ${{ steps.version.outputs.TAG }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm   # GitHub 原生 ARM runner（公开仓库可用）
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # 需要 srt-1.5.6/ 源码（git 仓库内）用于构建 libsrt
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 确定版本号
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "TAG=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # 无指定版本时用当前 git 描述（如 v0.1.0-3-gabc123）
            echo "TAG=$(git describe --tags --always 2>/dev/null || echo latest)" >> "$GITHUB_OUTPUT"
          fi

      # 2026-08-19 修复：把 TAG 作为 job output 传给 merge job。
      # 旧实现 merge job 无 checkout 步骤，git describe 失败 fallback 成 latest，
      # 与 build job 实际推送的 <sha>-amd64/<sha>-arm64 不一致 ->
      # "ghcr.io/...:latest-amd64: not found" 合并失败。
      # 现由 build job 计算一次，merge job 直接复用（单一事实来源）。

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送单架构镜像（原生编译）
        uses: docker/build-push-action@v6
        with:
          context: .
          # 各 job 只构建自己的架构（原生 runner 直接编译，无 QEMU 模拟）
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.TAG }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.TAG }}
            org.opencontainers.image.description=SRT-VPN - 基于 SRT 直播流协议的 VPN 隧道

  # 纯静态二进制（passwall 组件更新用）
  # 在 Alpine/musl 环境编译 libsrt + OpenSSL 静态库 -> 全静态链接
  # 产出：srt-vpn-linux-amd64 / srt-vpn-linux-arm64（无任何动态依赖，可直接跑在 OpenWrt 上）
  # 说明：GitHub runner（Ubuntu）本身不是 Alpine，这里用 rust:1.97-alpine 容器编译，
  #       保证 musl 静态链接（与 Dockerfile builder 阶段完全一致）
  build-binaries:
    name: Build Static Binaries (${{ matrix.arch }})
    needs: [build]   # 复用 build 的 TAG 输出作为版本号，保证与镜像 tag 一致
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 静态编译环境（与 Dockerfile builder 阶段一致，在 Alpine 容器内编译保证 musl 静态）
      # linux-headers：libsrt 源码包含 <linux/if.h>（2026-08-19 CI 踩坑）
      # openssl-libs-static：Rust musl 默认 -Wl,-Bstatic 必须静态 OpenSSL 库
      #                     （openssl-dev 只有 .so stub 会报 cannot find -lcrypto）
      # 挂载宿主 dist 目录经 Docker 卷写入产物（避免容器退出后文件丢失）
      - name: 在 Alpine 容器内静态编译
        run: |
          mkdir -p "$PWD/dist"
          docker run --rm -v "$PWD":/build -v "$PWD/dist":/dist -w /build \
            rust:1.97-alpine sh -c '
              set -e
              apk add --no-cache build-base cmake openssl-dev openssl-libs-static linux-headers pkgconfig
              cargo build --release
              cp target/release/srt-vpn /dist/srt-vpn-linux-${{ matrix.arch }}
              chmod +x /dist/srt-vpn-linux-${{ matrix.arch }}
            '

      - name: 验证静态链接
        run: |
          file dist/srt-vpn-linux-${{ matrix.arch }}
          # 真静态二进制 ldd 会报 "not a dynamic executable"
          ldd dist/srt-vpn-linux-${{ matrix.arch }} 2>&1 | head -3 || true

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: srt-vpn-linux-${{ matrix.arch }}
          path: dist/srt-vpn-linux-${{ matrix.arch }}

  # 通过 softprops/action-gh-release 上传二进制到 Release
  # - push tag（v*）触发：tag_name = 触发的 tag（更新该 tag 的 release 并附加二进制）
  # - workflow_dispatch 触发：创建/更新 v<version> 或 git describe 的 release
  release:
    name: Upload Binaries to Release
    needs: [build, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载二进制备件
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          # 只下载两个静态二进制 artifact（避免混入 docker build 的
          # dockerbuild 合成 artifact——其 blob 节点故障会导致 "download failed after 5 retries"）
          pattern: srt-vpn-linux-*

      - name: 确定 Release tag
        id: reltag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # tag 触发：直接用触发的 tag 名（如 v0.2.0）
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            # 手动触发且填了版本号：规范化加 v 前缀（v1.0.0 或 1.0.0 -> v1.0.0）
            v="${{ github.event.inputs.version }}"
            case "$v" in
              v*) echo "TAG=$v" >> "$GITHUB_OUTPUT" ;;
              *) echo "TAG=v$v" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            # 手动触发未填版本：用 git describe（与 build job 一致）
            echo "TAG=$(git describe --tags --always 2>/dev/null || echo latest)" >> "$GITHUB_OUTPUT"
          fi

      - name: 生成/更新 Release 并上传二进制
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.reltag.outputs.TAG }}
          name: SRT-VPN ${{ steps.reltag.outputs.TAG }}
          body: |
            ## SRT-VPN ${{ needs.build.outputs.tag }}

            ### 二进制（passwall 组件更新使用）
            - `srt-vpn-linux-amd64` — x86_64 纯静态
            - `srt-vpn-linux-arm64` — aarch64 纯静态

            ### Docker 镜像
            `ghcr.io/${{ github.repository }}:${{ needs.build.outputs.tag }}`

            > 纯静态构建：Alpine/musl 全静态链接（含 OpenSSL），OpenWrt 上零依赖直接运行。
          files: artifacts/*

      # 组件更新元数据（2026-08-19 passwall 兼容修复）
      # 背景：passwall 组件更新（com.lua get_url -> to_check）需要读取 release 元数据 JSON
      #       （tag_name + assets 列表）。此前用 api.github.com 直连，国内网络被墙
      #       -> 一直"更新中"。
      # 现改为：把元数据 JSON 作为 release asset 上传（固定文件名），
      #       通过 https://github.com/.../releases/latest/download/srt-vpn-release-api.json
      #       动态访问（github.com 域，国内可走 gh-proxy 镜像，与官方 api-cache 同机制）。
      - name: 构造组件更新元数据 JSON 并上传
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.reltag.outputs.TAG }}
        run: |
          # 构造与官方 api-cache 相同结构的 JSON（tag_name + assets，含浏览器下载地址）
          python3 - <<'PYEOF'
          import json, urllib.request, os
          tag = os.environ["TAG"]
          gh_token = os.environ.get("GITHUB_TOKEN", "")
          req = urllib.request.Request(
              f"https://api.github.com/repos/${{ github.repository }}/releases/tags/{tag}",
              headers={"Authorization": f"Bearer {gh_token}", "User-Agent": "srt-vpn-ci", "Accept": "application/vnd.github+json"},
          )
          try:
              rel = json.load(urllib.request.urlopen(req, timeout=30))
          except Exception as e:
              # API 拉取失败用最小占位（asset 缺省会在 to_check 报"无下载地址"但至少不卡死）
              print(f"::warning::{e}", flush=True)
              rel = {"tag_name": tag, "assets": [], "html_url": f"https://github.com/${{ github.repository }}/releases/tag/{tag}"}
          # 精简 assets（只要 srt-vpn 两个二进制，字段与官方缓存一致）
          slim = {
              "tag_name": rel.get("tag_name", tag),
              "html_url": rel.get("html_url", ""),
              "assets": [
                  {"name": a["name"], "size": a["size"], "browser_download_url": a["browser_download_url"]}
                  for a in rel.get("assets", [])
                  if a["name"] in ("srt-vpn-linux-amd64", "srt-vpn-linux-arm64")
              ],
          }
          with open("srt-vpn-release-api.json", "w") as f:
              json.dump(slim, f)
          print(f"生成元数据: tag={slim['tag_name']}, assets={len(slim['assets'])}")
          PYEOF
          # 上传元数据 JSON 到同一 release（softprops 幂等追加 asset）
          gh release upload "$TAG" srt-vpn-release-api.json --clobber

  # 合并多架构 manifest（等两个单架构 job 都成功后）
  merge:
    name: Merge Multi-Arch Manifest
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 设置 Docker Buildx（imagetools 需要）
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2026-08-19 修复：不再本地重算 TAG（旧实现无 checkout，git describe 失败
      # fallback 成 latest，与 build 实际推送的 <sha>-arch 不一致 -> 合并 not found）。
      # 直接复用 build job 的 outputs.tag。
      - name: 合并多架构 manifest 并打 latest
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          # 复用 build job 计算的 TAG（与实际推送的镜像 tag 严格一致）
          TAG="${{ needs.build.outputs.tag }}"
          echo "合并 tag: $TAG"
          # 用 imagetools 把两个单架构镜像合并为多架构 manifest（无需本地拉取）
          docker buildx imagetools create \
            -t "$IMAGE:$TAG" \
            "$IMAGE:$TAG-amd64" \
            "$IMAGE:$TAG-arm64"
          # latest 也指向多架构
          docker buildx imagetools create \
            -t "$IMAGE:latest" \
            "$IMAGE:$TAG-amd64" \
            "$IMAGE:$TAG-arm64"
